[package]
name = "skill-news-headlines"
version = "0.1.0"
edition = "2021"
description = "News headlines skill: topic-based top headlines"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
metrics = "0.21"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
skill-live-info-common = { path = "../skill-live-info-common" }
thiserror = "1.0"
tokio = { version = "1", features = ["sync"] }
urlencoding = "2.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync"] }
