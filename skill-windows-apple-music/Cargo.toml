[package]
name = "skill-windows-apple-music"
version = "0.1.0"
edition = "2021"
description = "Windows frontend Apple Music skill powered by embedded web player internals"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
jiff = { version = "1", features = ["serde"] }
dirs = "6.0"
keyring = { version = "3.6", features = ["windows-native"] }
metrics = "0.21"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rodio = { version = "0.21", default-features = true, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
urlencoding = "2.1"
webbrowser = "1.0"
wry = "0.24.7"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
