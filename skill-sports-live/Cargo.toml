[package]
name = "skill-sports-live"
version = "0.1.0"
edition = "2021"
description = "Sports live skill: schedules, scores, and scorers"

[dependencies]
async-trait = "0.1"
jiff = "1"
metrics = "0.21"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
skill-live-info-common = { path = "../skill-live-info-common" }
thiserror = "1.0"
urlencoding = "2.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
