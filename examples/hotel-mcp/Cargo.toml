[workspace]

[package]
name = "hotel-mcp"
version = "0.1.0"
edition = "2021"
description = "Reference Hotel MCP server (JSON-RPC over HTTP/SSE) used by the concierge-room demo."
publish = false

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["clock"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skill-hotel = { path = "../../skill-hotel" }
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

[[bin]]
name = "hotel-mcp"
path = "src/main.rs"

[lib]
name = "hotel_mcp"
path = "src/lib.rs"
