<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Concierge Room — aice demo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --bg-elev: #121a2c;
      --bg-elev-2: #1a2440;
      --fg: #e6ecf6;
      --fg-dim: #94a3b8;
      --fg-muted: #64748b;
      --accent: #7dd3fc;
      --accent-strong: #38bdf8;
      --warn: #fbbf24;
      --err: #f87171;
      --ok: #4ade80;
      --border: #1f2a44;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      --radius: 14px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; }
    body {
      background: radial-gradient(ellipse at top, #14223e 0%, #070b14 60%, #050811 100%);
      color: var(--fg);
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(420px, 1.4fr);
      grid-template-rows: auto 1fr;
      gap: 18px;
      height: 100vh;
      padding: 18px;
    }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto auto auto 1fr; }
    }
    header {
      grid-column: 1 / -1;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px;
      background: linear-gradient(135deg, #142142, #0c1530);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .title { display: flex; gap: 14px; align-items: baseline; }
    .title h1 { margin: 0; font-size: 20px; letter-spacing: 0.4px; }
    .title .sub { color: var(--fg-dim); font-size: 13px; }
    .state-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      font-weight: 600;
      font-size: 13px;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .state-pill .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent-strong);
      box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.6);
      animation: pulse 1.6s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.6); }
      80% { box-shadow: 0 0 0 12px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }
    .col {
      display: flex; flex-direction: column; gap: 14px;
      overflow: hidden;
    }
    .panel {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
    }
    .panel h2 {
      margin: 0 0 8px 0;
      font-size: 12px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--fg-dim);
    }
    .transcript-text {
      font-size: 22px; line-height: 1.35;
      min-height: 56px;
    }
    .transcript-text .partial { color: var(--fg-dim); font-style: italic; }
    .classifier .row, .skill .row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 6px;
      background: rgba(125, 211, 252, 0.18);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .latency { color: var(--fg-dim); font-variant-numeric: tabular-nums; font-size: 12px; }
    pre {
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      max-height: 200px;
      overflow: auto;
      margin: 8px 0 0 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .reply { font-size: 18px; line-height: 1.5; min-height: 56px; }
    .reply .cursor { animation: blink 1s steps(1, end) infinite; opacity: 0.7; }
    @keyframes blink { 50% { opacity: 0; } }

    .timeline-wrap { overflow: auto; max-height: 100%; padding-right: 4px; }
    .turn {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .turn-header {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 8px; margin-bottom: 6px;
    }
    .turn-id { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; color: var(--fg-muted); }
    .turn-title { font-size: 14px; font-weight: 600; color: var(--fg); }
    .turn-utter { color: var(--fg-dim); font-size: 13px; margin-bottom: 8px; word-break: break-word; }
    .timeline { position: relative; }
    .row-stage {
      display: grid;
      grid-template-columns: 130px 1fr 70px;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      border-top: 1px solid var(--border);
    }
    .row-stage:first-child { border-top: none; }
    .stage-name { color: var(--fg-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; }
    .bar {
      position: relative;
      background: rgba(125, 211, 252, 0.1);
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
    }
    .bar > .fill {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      border-radius: 999px;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
    }
    .bar.warn > .fill { background: linear-gradient(90deg, var(--warn), #f59e0b); box-shadow: 0 0 14px rgba(251, 191, 36, 0.4); }
    .bar.err  > .fill { background: linear-gradient(90deg, var(--err), #ef4444); box-shadow: 0 0 14px rgba(239, 68, 68, 0.4); }
    .row-stage .ms { font-variant-numeric: tabular-nums; text-align: right; color: var(--fg-dim); font-size: 12px; }

    .meta-line { color: var(--fg-muted); font-size: 12px; margin-top: 4px; }
    .meta-line strong { color: var(--fg-dim); font-weight: 600; }
    .empty {
      color: var(--fg-muted);
      text-align: center;
      padding: 32px 16px;
      font-style: italic;
      font-size: 14px;
    }
    .conn-tag {
      font-size: 11px; color: var(--fg-muted);
    }
    .conn-tag.ok { color: var(--ok); }
    .conn-tag.bad { color: var(--err); }
  </style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const STAGE_LABELS = {
    turn_started: 'Turn started',
    wake_word_detected: 'Wake word',
    transcript_partial: 'Transcribing',
    classifier_started: 'Classifying',
    classifier_done: 'Classified',
    mcp_call_started: 'Calling MCP',
    mcp_call_done: 'MCP done',
    mcp_call_error: 'MCP error',
    skill_result_sent: 'Skill result',
    assistant_token: 'Assistant',
    turn_done: 'Turn done',
  };
  const STAGE_ORDER = [
    'turn_started',
    'wake_word_detected',
    'transcript_partial',
    'classifier_started',
    'classifier_done',
    'mcp_call_started',
    'mcp_call_done',
    'mcp_call_error',
    'skill_result_sent',
    'assistant_token',
    'turn_done',
  ];

  const state = {
    bridgeState: 'connecting',
    bridgeDetail: '',
    turns: new Map(),
    turnOrder: [],
    activeTurnId: null,
    wsConnected: false,
  };

  function el(tag, attrs = {}, ...children) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') e.className = v;
      else if (k === 'style') Object.assign(e.style, v);
      else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v !== false && v != null) e.setAttribute(k, v);
    }
    for (const c of children) {
      if (c == null || c === false) continue;
      e.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return e;
  }

  function getOrCreateTurn(turnId) {
    if (!turnId) return null;
    let turn = state.turns.get(turnId);
    if (!turn) {
      turn = {
        id: turnId,
        firstTms: null,
        lastTms: null,
        events: [],
        stages: {},
        transcript: { partial: '', stable: '' },
        classifier: null,
        mcpCall: null,
        mcpResponse: null,
        mcpError: null,
        assistantText: '',
        skillResult: null,
        finished: false,
      };
      state.turns.set(turnId, turn);
      state.turnOrder.unshift(turnId);
      while (state.turnOrder.length > 30) {
        const removed = state.turnOrder.pop();
        state.turns.delete(removed);
      }
    }
    return turn;
  }

  function applyEvent(ev) {
    if (ev.stage === 'state') {
      state.bridgeState = ev.label;
      state.bridgeDetail = ev.detail || '';
      return;
    }
    if (ev.stage === 'backend_error' && !ev.turn_id) {
      state.bridgeState = 'backend_error';
      state.bridgeDetail = ev.message;
      return;
    }
    const turn = getOrCreateTurn(ev.turn_id);
    if (!turn) return;
    if (turn.firstTms == null) turn.firstTms = ev.t_ms;
    turn.lastTms = ev.t_ms;
    turn.events.push(ev);
    turn.stages[ev.stage] = ev;
    state.activeTurnId = ev.turn_id;

    switch (ev.stage) {
      case 'transcript_partial':
        if (ev.stable) turn.transcript.stable = ev.text;
        else turn.transcript.partial = ev.text;
        break;
      case 'classifier_done':
        turn.classifier = {
          intent: ev.intent,
          slots: ev.slots,
          user_text: ev.user_text,
          latency_ms: ev.latency_ms,
        };
        break;
      case 'mcp_call_started':
        turn.mcpCall = { tool: ev.tool, args: ev.args };
        break;
      case 'mcp_call_done':
        turn.mcpResponse = { tool: ev.tool, response: ev.response, latency_ms: ev.latency_ms };
        break;
      case 'mcp_call_error':
        turn.mcpError = { tool: ev.tool, error: ev.error, latency_ms: ev.latency_ms };
        break;
      case 'assistant_token':
        turn.assistantText += ev.token;
        break;
      case 'skill_result_sent':
        turn.skillResult = { status: ev.status, user_text: ev.user_text };
        break;
      case 'turn_done':
        turn.finished = true;
        break;
    }
  }

  function fmtMs(n) {
    if (n == null) return '—';
    if (n < 1000) return `${n} ms`;
    return `${(n / 1000).toFixed(2)} s`;
  }

  function renderHeader() {
    const stateLabel = state.bridgeState.replace(/_/g, ' ');
    return el('header', {},
      el('div', { class: 'title' },
        el('h1', {}, 'Concierge Room'),
        el('span', { class: 'sub' }, 'aice hotel skill demo'),
      ),
      el('div', { class: 'state-pill' },
        el('span', { class: 'dot' }),
        stateLabel + (state.bridgeDetail ? ' · ' + state.bridgeDetail : ''),
      ),
    );
  }

  function renderLiveColumn() {
    const turn = state.turns.get(state.activeTurnId);
    const partial = turn?.transcript.partial || '';
    const stable = turn?.transcript.stable || '';
    return el('div', { class: 'col' },
      el('div', { class: 'panel' },
        el('h2', {}, 'Transcript'),
        el('div', { class: 'transcript-text' },
          stable ? el('span', {}, stable) : null,
          partial ? el('span', { class: 'partial' }, (stable ? ' ' : '') + partial) : null,
          (!stable && !partial) ? el('span', { class: 'partial' }, 'waiting for guest…') : null,
        ),
      ),
      el('div', { class: 'panel classifier' },
        el('h2', {}, 'Classifier'),
        renderClassifier(turn),
      ),
      el('div', { class: 'panel skill' },
        el('h2', {}, 'Hotel MCP call'),
        renderMcp(turn),
      ),
      el('div', { class: 'panel' },
        el('h2', {}, 'Assistant reply'),
        el('div', { class: 'reply' },
          turn?.assistantText
            ? el('span', {}, turn.assistantText)
            : el('span', { class: 'partial' }, 'awaiting reply…'),
          turn?.assistantText && !turn.finished
            ? el('span', { class: 'cursor' }, '▍')
            : null,
        ),
      ),
    );
  }

  function renderClassifier(turn) {
    const c = turn?.classifier;
    if (!c) {
      return el('div', { class: 'meta-line' }, 'no intent classified yet');
    }
    return el('div', {},
      el('div', { class: 'row' },
        el('span', { class: 'badge' }, c.intent || 'unknown'),
        el('span', { class: 'latency' }, fmtMs(c.latency_ms) + ' classifier'),
      ),
      c.user_text ? el('div', { class: 'meta-line' }, el('strong', {}, 'utterance: '), c.user_text) : null,
      el('pre', {}, JSON.stringify(c.slots, null, 2)),
    );
  }

  function renderMcp(turn) {
    if (turn?.mcpError) {
      return el('div', {},
        el('div', { class: 'row' },
          el('span', { class: 'badge', style: { background: 'rgba(248,113,113,.18)', color: 'var(--err)' } }, turn.mcpError.tool),
          el('span', { class: 'latency' }, fmtMs(turn.mcpError.latency_ms)),
        ),
        el('div', { class: 'meta-line' }, 'error: ' + turn.mcpError.error),
      );
    }
    if (turn?.mcpResponse) {
      return el('div', {},
        el('div', { class: 'row' },
          el('span', { class: 'badge' }, turn.mcpResponse.tool),
          el('span', { class: 'latency' }, fmtMs(turn.mcpResponse.latency_ms) + ' tool'),
        ),
        turn.mcpCall ? el('pre', {}, JSON.stringify(turn.mcpCall.args, null, 2)) : null,
        el('div', { class: 'meta-line' }, el('strong', {}, 'response')),
        el('pre', {}, JSON.stringify(turn.mcpResponse.response, null, 2)),
      );
    }
    if (turn?.mcpCall) {
      return el('div', {},
        el('div', { class: 'row' },
          el('span', { class: 'badge' }, turn.mcpCall.tool),
          el('span', { class: 'latency' }, 'in flight…'),
        ),
        el('pre', {}, JSON.stringify(turn.mcpCall.args, null, 2)),
      );
    }
    return el('div', { class: 'meta-line' }, 'no MCP call yet for this turn');
  }

  function renderTimelineColumn() {
    const items = state.turnOrder.map((id) => state.turns.get(id)).filter(Boolean);
    if (!items.length) {
      return el('div', { class: 'col' },
        el('div', { class: 'panel' },
          el('h2', {}, 'Journey timeline'),
          el('div', { class: 'empty' }, 'No turns yet. Speak to the room.'),
        ),
      );
    }
    return el('div', { class: 'col timeline-wrap' },
      ...items.map(renderTurn),
    );
  }

  function renderTurn(turn) {
    const totalMs = (turn.lastTms ?? 0) - (turn.firstTms ?? 0) || 1;
    const eventsByStage = STAGE_ORDER
      .filter((stage) => turn.stages[stage])
      .map((stage) => ({ stage, ev: turn.stages[stage] }));
    const title = turn.classifier?.intent
      ? `${turn.classifier.intent} · ${turn.classifier?.user_text || ''}`
      : turn.transcript.stable || turn.transcript.partial || 'incoming turn';
    return el('div', { class: 'turn' },
      el('div', { class: 'turn-header' },
        el('div', { class: 'turn-title' }, title),
        el('div', { class: 'turn-id' }, turn.id.slice(0, 8) + '…'),
      ),
      el('div', { class: 'turn-utter' }, turn.skillResult?.user_text || ''),
      el('div', { class: 'timeline' },
        ...eventsByStage.map(({ stage, ev }) => {
          const offset = (ev.t_ms - turn.firstTms);
          const pct = Math.max(0.05, Math.min(1, offset / totalMs));
          const widthPct = (pct * 100).toFixed(1) + '%';
          const klass = stage === 'mcp_call_error' ? 'err' : stage === 'classifier_started' ? 'warn' : '';
          return el('div', { class: 'row-stage' },
            el('span', { class: 'stage-name' }, STAGE_LABELS[stage] || stage),
            el('div', { class: 'bar ' + klass },
              el('div', { class: 'fill', style: { width: widthPct } }),
            ),
            el('span', { class: 'ms' }, fmtMs(offset)),
          );
        }),
      ),
      turn.finished
        ? el('div', { class: 'meta-line' }, el('strong', {}, 'total: '), fmtMs(totalMs))
        : null,
    );
  }

  function render() {
    const root = document.getElementById('root');
    const tree = el('div', { class: 'app' },
      renderHeader(),
      renderLiveColumn(),
      renderTimelineColumn(),
    );
    root.replaceChildren(tree);
  }

  function connect() {
    const url = `ws://${location.host}/viz`;
    const ws = new WebSocket(url);
    ws.addEventListener('open', () => {
      state.wsConnected = true;
      render();
    });
    ws.addEventListener('message', (msg) => {
      try {
        const ev = JSON.parse(msg.data);
        applyEvent(ev);
        render();
      } catch (e) {
        console.warn('bad viz event', e);
      }
    });
    ws.addEventListener('close', () => {
      state.wsConnected = false;
      render();
      setTimeout(connect, 1500);
    });
    ws.addEventListener('error', () => ws.close());
  }

  render();
  connect();
})();
</script>
</body>
</html>
