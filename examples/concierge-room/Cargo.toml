[workspace]

[package]
name = "concierge-room"
version = "0.1.0"
edition = "2021"
description = "Hotel concierge room demo: cpal mic + UDP discovery + WS bridge with browser visualization."
publish = false

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "ws"] }
cpal = "0.15"
futures = "0.3"
futures-util = "0.3"
mime_guess = "2"
reqwest = { version = "0.12", features = ["json"] }
rust-embed = { version = "8", features = ["interpolate-folder-path", "include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skill-hotel = { path = "../../skill-hotel" }
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[lib]
name = "concierge_room"
path = "src/lib.rs"

[[bin]]
name = "concierge-room"
path = "src/main.rs"
