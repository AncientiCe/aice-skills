[package]
name = "skill-email"
version = "0.1.0"
edition = "2021"
description = "Email skill: Apple Mail.app (macOS) and IMAP (cross-platform) + LLM triage"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
metrics = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
