[package]
name = "skill-air-quality"
version = "0.1.0"
edition = "2021"
description = "Air quality skill backed by Open-Meteo's air-quality API (free, no key)"

[dependencies]
async-trait = "0.1"
metrics = "0.21"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
skill-live-info-common = { path = "../skill-live-info-common" }
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
