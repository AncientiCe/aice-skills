[package]
name = "skill-journal"
version = "0.1.0"
edition = "2021"
description = "Voice journaling skill: timestamped entries with sentiment and temporal recall (SQLite)"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
metrics = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
