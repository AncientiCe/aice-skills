[workspace]
resolver = "2"
members = [
    ".",
    "skill-app-switcher",
    "skill-assistant",
    "skill-computer",
    "skill-distance",
    "skill-media",
    "skill-memory",
    "skill-message",
    "skill-reminder",
    "skill-screenshot",
    "skill-shopping-list",
    "skill-smart-home",
    "skill-time",
    "skill-timer",
    "skill-volume",
    "skill-weather",
]

[package]
name = "core-skills"
version = "0.1.0"
edition = "2021"
description = "Skill registry and re-exports for voice assistant skills"

[dependencies]
skill-app-switcher = { path = "skill-app-switcher" }
skill-assistant = { path = "skill-assistant" }
skill-computer = { path = "skill-computer" }
skill-distance = { path = "skill-distance" }
skill-media = { path = "skill-media" }
skill-memory = { path = "skill-memory" }
skill-message = { path = "skill-message" }
skill-reminder = { path = "skill-reminder" }
skill-screenshot = { path = "skill-screenshot" }
skill-shopping-list = { path = "skill-shopping-list" }
skill-smart-home = { path = "skill-smart-home" }
skill-time = { path = "skill-time" }
skill-timer = { path = "skill-timer" }
skill-volume = { path = "skill-volume" }
skill-weather = { path = "skill-weather" }
