[package]
name = "skill-horoscope-daily"
version = "0.1.0"
edition = "2021"
description = "Horoscope daily skill: zodiac forecast lookup"

[dependencies]
async-trait = "0.1"
jiff = "1"
metrics = "0.21"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skill-live-info-common = { path = "../skill-live-info-common" }
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
